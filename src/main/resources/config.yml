        - '§eClique §7= enable/disable'
        - '§eShift+Clique §7= debug'
        - '§eBotão direito §7= call'
    Anterior:
      Material: ARROW
      Name: '§7§l◀ Anterior'
    Proximo:
      Material: ARROW
      Name: '§7§lPróximo ▶'
    Fechar:
      Material: BARRIER
      Name: '§c§lFechar'
    Info:
      Material: BOOK
      Name: '§e§l%n% §7eventos carregados'

