# =========================================================
#  GUI — todas as strings e materiais dos menus
# =========================================================
Gui:
  # ============ MENU PRINCIPAL ITEM ============
  MainItem:
    Title: '§8§l✦ Editor de Item'
    # Material do preview (item na mão) é dinâmico
    Nome:
      Material: NAME_TAG
      Name: '§e§lNome'
      Lore:
        - '§7Renomeia o item.'
        - ''
        - '§8Clique para editar'
    Lore:
      Material: WRITABLE_BOOK
      Name: '§e§lLore'
      Lore:
        - '§7Edita as linhas de lore.'
        - ''
        - '§8Clique para abrir'
    Comida:
      Material: APPLE
      Name: '§e§lComida'
      Lore:
        - '§7Torna o item comestível.'
        - ''
        - '§8Clique e digite nutrition/saturation'
    Efeitos:
      Material: BREWING_STAND
      Name: '§e§lEfeitos'
      Lore:
        - '§7Efeitos enquanto equipado.'
        - ''
        - '§8Clique para abrir'
    Pdc:
      Material: PAPER
      Name: '§e§lPDC'
      Lore:
        - '§7Dados persistentes no item.'
        - ''
        - '§8Clique para abrir'
    Unbreakable:
      Material: ANVIL
      Name: '§e§lIndestrutível'
      Lore:
        - '§7Toggle unbreakable.'
        - ''
        - '§8Clique para alternar'
    Info:
      Material: CHEST
      Name: '§e§lInfo/NBT'
      Lore:
        - '§7Ver dump completo.'
        - ''
        - '§8Clique para ver'
    Salvar:
      Material: EMERALD
      Name: '§a§lSalvar'
      Lore:
        - '§7Salva o item atual.'
        - ''
        - '§8Clique e digite o nome'
    Limpar:
      Material: BARRIER
      Name: '§c§lLimpar Item'
      Lore:
        - '§7Remove o item da mão.'
        - ''
        - '§cAção irreversível'
    CopiarEfeitos:
      Material: PAPER
      Name: '§b§lCopiar Efeitos'
      Lore:
        - '§7Copia efeitos de outro item.'
        - ''
        - '§8Clique para abrir'
    CopiarItem:
      Material: WRITTEN_BOOK
      Name: '§b§lCopiar Item Salvo'
      Lore:
        - '§7Aplica meta de item salvo.'
        - ''
        - '§8Clique para abrir'
    Border:
      Material: BLACK_STAINED_GLASS_PANE
      Name: '§8'

  # ============ SUBMENU LORE ============
  LoreMenu:
    Title: '§8§l✦ Lore'
    Linha:
      Material: PAPER
      Name: '§7Linha %n%'
      Lore:
        - '%line%'
        - ''
        - '§8Clique pra remover'
    Adicionar:
      Material: LIME_DYE
      Name: '§a§lAdicionar linha'
      Lore:
        - '§7Clique e digite no chat'
        - '§8Use §f| §8pra várias linhas'
    Voltar:
      Material: ARROW
      Name: '§7§lVoltar'
    Limpar:
      Material: BARRIER
      Name: '§c§lLimpar tudo'

  # ============ SUBMENU EFFECT ============
  EffectMenu:
    Title: '§8§l✦ Efeitos'
    Efeito:
      Material: POTION
      Name: '§d%potion%'
      Lore:
        - '§7Duração: §f%dur% ticks'
        - '§7Amplificador: §f%amp%'
        - ''
        - '§8Clique pra remover'
    Adicionar:
      Material: LIME_DYE
      Name: '§a§lAdicionar efeito'
      Lore:
        - '§7Clique e digite:'
        - '§e<potion> <duração> [amp]'
    Voltar:
      Material: ARROW
      Name: '§7§lVoltar'
    Limpar:
      Material: BARRIER
      Name: '§c§lLimpar todos'

  # ============ SUBMENU PDC ============
  PdcMenu:
    Title: '§8§l✦ PDC'
    Chave:
      Material: PAPER
      Name: '§e%key%'
      Lore:
        - '§7Valor: §f%value%'
        - ''
        - '§8Clique pra remover'
    Setar:
      Material: LIME_DYE
      Name: '§a§lSetar PDC'
      Lore:
        - '§7Clique e digite:'
        - '§e<chave> <valor>'
    Voltar:
      Material: ARROW
      Name: '§7§lVoltar'
    Limpar:
      Material: BARRIER
      Name: '§c§lLimpar todos'

  # ============ COPIAR EFEITOS ============
  CopyEffectsMenu:
    Title: '§8§l✦ Copiar Efeitos'
    Item:
      Name: '§e%material%'
      Lore:
        - '§7Efeitos: §f%n%'
        - ''
        - '§8Clique para copiar pro item da mão'
    Vazio:
      Material: BARRIER
      Name: '§cNenhum item com efeitos'
      Lore:
        - '§7no seu inventário.'
    Voltar:
      Material: ARROW
      Name: '§7§lVoltar'

  # ============ COPIAR ITEM SALVO ============
  CopySavedMenu:
    Title: '§8§l✦ Copiar Item Salvo'
    Item:
      Name: '§e%name%'
      Lore:
        - '§7Material: §f%material%'
        - ''
        - '§8Clique para aplicar no item da mão'
    Vazio:
      Material: BARRIER
      Name: '§cNenhum item salvo'
      Lore:
        - '§7Use §e/pc item save §7primeiro.'
    Voltar:
      Material: ARROW
      Name: '§7§lVoltar'

  # ============ EVENTS GUI ============
  EventsMenu:
    Title: '§8§l✦ Eventos §7[%page%/%total%]'
    EventAtivo:
      Material: LIME_DYE
      Name: '§e%event%'
      Lore:
        - '§7Tipo: §f%type%'
        - '§7Status: §aativo'
        - ''
        - '§eClique §7= enable/disable'
        - '§eShift+Clique §7= debug'
        - '§eBotão direito §7= call'
    EventInativo:
      Material: GRAY_DYE
      Name: '§e%event%'
      Lore:
        - '§7Tipo: §f%type%'
        - '§7Status: §cinativo'
